{% extends "layout.html" %}
{% block login_content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <i class="fab fa-whatsapp"></i>
            <span>WP PORTAL</span>
        </div>
        <div class="login-header">
            <h2>Welcome</h2>
            <p>Please sign in to your account to continue</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)" style="left: auto; right: 1rem; cursor: pointer; pointer-events: auto;"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary login-btn">Sign In</button>
        </form>

    </div>
</div>

<style>
    .login-page {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: url('/static/media/login_bg.png') no-repeat center center;
        background-size: cover;
        padding: 2rem;
    }

    .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 3rem;
        border-radius: 1.25rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .login-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
        color: var(--primary);
        font-weight: 800;
        font-size: 1.5rem;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-header h2 {
        font-size: 1.75rem;
        color: var(--text-main);
        margin-bottom: 0.5rem;
        font-weight: 800;
    }

    .login-header p {
        color: var(--text-muted);
        font-size: 0.875rem;
    }

    .input-wrapper {
        position: relative;
    }

    .input-wrapper i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    .input-wrapper input {
        padding-left: 2.75rem !important;
    }

    .login-btn {
        width: 100%;
        padding: 1rem !important;
        font-size: 1rem !important;
        margin-top: 1rem;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
</style>

<script>
    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconElement.classList.remove('fa-eye');
            iconElement.classList.add('fa-eye-slash');
        } else {
            input.type = "password";
            iconElement.classList.remove('fa-eye-slash');
            iconElement.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
